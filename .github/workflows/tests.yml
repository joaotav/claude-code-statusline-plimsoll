name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Memory is read differently on each (/proc vs vm_stat and ps).
        os: [ubuntu-latest, macos-latest]
        # Oldest supported (unittest's enterContext needs 3.11) and newest.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Render every fixture
        run: ./scripts/run-fixtures.sh

  oldest-python:
    # The script supports 3.8, but the unit tests need 3.11, so this only
    # renders the samples. Pinned: there's no 3.8 build for Ubuntu 26.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.8"

      - name: Render every fixture
        run: ./scripts/run-fixtures.sh
